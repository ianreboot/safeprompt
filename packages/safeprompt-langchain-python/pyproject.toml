[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safeprompt-langchain"
version = "0.1.0"
description = "LangChain integration for SafePrompt: prompt-injection detection as a callback handler. Validates every prompt flowing through a chain before it reaches the LLM."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Reboot Inc", email = "support@safeprompt.dev" }]
keywords = [
    "langchain",
    "safeprompt",
    "prompt-injection",
    "llm-security",
    "jailbreak",
    "ai-security",
    "callback-handler",
    "owasp-llm",
    "rag-security",
    "agent-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://safeprompt.dev"
Documentation = "https://safeprompt.dev/docs"
Repository = "https://github.com/ianreboot/safeprompt"
Issues = "https://github.com/ianreboot/safeprompt/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/safeprompt_langchain"]
