name: Publish Python SDK to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build & publish safeprompt to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/safeprompt/
    permissions:
      id-token: write     # required for PyPI Trusted Publishing (OIDC)
      contents: read
    defaults:
      run:
        working-directory: packages/safeprompt-python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install --upgrade hatch

      - name: Build wheel + sdist
        run: hatch build

      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/safeprompt-python/dist
          verbose: true
