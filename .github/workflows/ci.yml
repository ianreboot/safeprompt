name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/safeprompt-js/package-lock.json
      - name: Install
        working-directory: packages/safeprompt-js
        run: npm ci || npm install
      - name: Build
        working-directory: packages/safeprompt-js
        run: npm run build
      - name: Test
        working-directory: packages/safeprompt-js
        run: npm test

  python:
    name: Python SDK (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        working-directory: packages/safeprompt-python
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-mock httpx
      - name: Test
        working-directory: packages/safeprompt-python
        run: python -m pytest -v
